<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Triki Pixel</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
<style>
  * { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  html,body { height:100%; }
  body {
    background:#0b0b14;
    font-family:'Press Start 2P', monospace;
    color:#39ff88;
    display:flex; align-items:center; justify-content:center;
    min-height:100vh;
    overflow:hidden;
  }
  body::after {
    content:""; position:fixed; inset:0; pointer-events:none; z-index:99;
    background:repeating-linear-gradient(0deg, rgba(0,0,0,.14) 0 2px, transparent 2px 4px);
  }
  #wrap {
    width:min(500px, 100vw);
    display:flex; flex-direction:column; align-items:center; justify-content:center;
    gap:14px; padding:14px; position:relative;
  }
  .screen { display:flex; flex-direction:column; align-items:center; gap:16px; width:100%; }
  .hidden { display:none !important; }
  .title { font-size:30px; letter-spacing:2px; text-shadow:4px 4px 0 #14532d; text-align:center; line-height:1.5; }
  .subtitle { font-size:10px; color:#57c7ff; letter-spacing:4px; }
  .msg { font-size:9px; color:#ff5d5d; min-height:14px; text-align:center; line-height:1.6; }
  .pbtn {
    font-family:inherit; font-size:12px; cursor:pointer;
    background:#1b1b2e; color:#39ff88; border:4px solid #39ff88;
    box-shadow:0 5px 0 #14532d;
    padding:14px 18px; text-transform:uppercase; width:100%; max-width:320px;
  }
  .pbtn:active { transform:translateY(5px); box-shadow:0 0 0 #14532d; }
  .pbtn.small { font-size:10px; padding:11px 12px; width:auto; gap:6px; }
  .pbtn.tiny { font-size:8px; padding:8px 10px; width:auto; box-shadow:0 4px 0 #14532d; }
  .pbtn.alt { color:#ffd166; border-color:#ffd166; box-shadow:0 5px 0 #6b4e00; }
  .pbtn.alt:active { box-shadow:0 0 0 #6b4e00; }
  .pbtn:disabled { opacity:.4; cursor:default; }
  .joinrow { display:flex; gap:15px; width:100%; max-width:320px; }
  .joinrow input {
    font-family:inherit; font-size:14px; text-transform:uppercase; text-align:center;
    background:#10101c; color:#ffe066; border:4px solid #57c7ff; outline:none;
    width:130px; padding:10px 6px; letter-spacing:4px;
  }
  .joinrow .pbtn { flex:1; }
  #topbar { display:flex; align-items:center; gap:10px; font-size:10px; flex-wrap:wrap; justify-content:center; }
  #roomLabel { color:#ffe066; letter-spacing:2px; }
  #cv {
    width:min(92vw, 500px, calc(100vh - 330px));
    aspect-ratio:1/1;
    background:#10101c;
    border:4px solid #2a2a3d;
    image-rendering:pixelated;
    touch-action:manipulation;
    box-shadow:0 0 0 4px #10101c, 0 0 32px rgba(57,255,136,.15);
  }
  #status { font-size:11px; min-height:16px; text-align:center; line-height:1.7; }
  #status .cX { color:#ff5d5d; } #status .cO { color:#57c7ff; }
  #scores { font-size:9px; color:#8b8ba3; display:flex; gap:14px; }
  #scores b { font-weight:normal; }
  #scores .sX { color:#ff5d5d; } #scores .sO { color:#57c7ff; } #scores .sD { color:#ffd166; }
  .btnrow { display:flex; gap:10px; flex-wrap:wrap; justify-content:center; }

  /* ---------- panel de reacciones ---------- */
  #reactPanel {
    position:absolute; bottom:120px; left:50%; transform:translateX(-50%);
    background:#1b1b2e; border:4px solid #57c7ff; box-shadow:0 6px 0 #123a52;
    display:grid; grid-template-columns:repeat(4, 1fr); gap:6px; padding:10px;
    z-index:50;
  }
  #reactPanel button {
    font-size:26px; background:#10101c; border:3px solid #2a2a3d;
    width:52px; height:52px; cursor:pointer; line-height:1;
  }
  #reactPanel button:active { border-color:#57c7ff; transform:scale(.9); }
/*-------------------- panel de revancha ---------*/
  #rematchPanel {
  position:absolute; top:50%; left:50%; transform:translate(-50%,-50%);
  background:#1b1b2e; border:4px solid #ffd166; box-shadow:0 6px 0 #6b4e00;
  padding:16px; z-index:55;
  display:flex; flex-direction:column; align-items:center; gap:14px;
  max-width:90%;
}
  #rematchPanel p { font-size:10px; color:#ffd166; text-align:center; line-height:1.7; }
  .rematchBtns { display:flex; gap:10px; }
  .pbtn.danger { color:#ff5d5d; border-color:#ff5d5d; box-shadow:0 5px 0 #5c1a1a; }
  .pbtn.danger:active { box-shadow:0 0 0 #5c1a1a; }

  /* ---------- emojis flotantes ---------- */
  #fx { position:absolute; inset:0; pointer-events:none; overflow:hidden; z-index:60; }
  .float-emoji {
    position:absolute; bottom:20%; left:50%;
    font-size:72px; transform:translateX(-50%);
    animation:floatUp 1.6s ease-out forwards;
    filter:drop-shadow(0 0 12px rgba(255,255,255,.35));
  }
  .float-emoji.mine { font-size:48px; opacity:.85; }
  @keyframes floatUp {
    0%   { transform:translateX(-50%) translateY(0) scale(.4); opacity:0; }
    12%  { transform:translateX(-50%) translateY(-20px) scale(1.15); opacity:1; }
    25%  { transform:translateX(calc(-50% + var(--dx,0px))) translateY(-45px) scale(1); }
    100% { transform:translateX(calc(-50% + var(--dx,0px))) translateY(-260px) scale(.9); opacity:0; }
  }
</style>
</head>
<body>
<div id="wrap">

  <div id="menu" class="screen">
    <h1 class="title">TRI<br>KI</h1>
    <p class="subtitle">PARCHEMONOS UN RATON!!</p>
    <button id="btnCreate" class="pbtn">JUGUEMOLE</button>
    <div class="joinrow">
      <input id="codeInput" maxlength="4" placeholder="CODIGO" autocomplete="off" spellcheck="false">
      <button id="btnJoin" class="pbtn small">COMO ES,COMO SERIA?</button>
    </div>
    <p id="menuMsg" class="msg"></p>
  </div>

  <div id="game" class="screen hidden">
    <div id="topbar">
      <span id="roomLabel"></span>
      <button id="btnCopy" class="pbtn tiny">COPIAR INVITACION</button>
      <button id="btnSound" class="pbtn tiny">MUSIQUITA: ON</button>
    </div>
    <canvas id="cv" width="500" height="500"></canvas>
    <div id="status"></div>
    <div id="scores"></div>
    <div class="btnrow">
      <button id="btnReact" class="pbtn small alt">😀 REACCION</button>
      <button id="btnRematch" class="pbtn small alt hidden">OTRO!-O-CAGA?</button>
      <button id="btnLeave" class="pbtn small">CORRE PERRA</button>
    </div>
  </div>

  <div id="reactPanel" class="hidden"></div>
  <div id="fx"></div>
  <div id="rematchPanel" class="hidden">
  <p id="rematchText">EL VAGAL PIDE REVANCHA</p>
  <div class="rematchBtns">
    <button id="btnAccept" class="pbtn small">BREVE</button>
    <button id="btnDecline" class="pbtn small danger">LLORELO</button>
  </div>
</div>

</div>

<script src="/socket.io/socket.io.js"></script>
<script>
const $ = (id) => document.getElementById(id);
const cv = $("cv"), ctx = cv.getContext("2d");
ctx.imageSmoothingEnabled = false;

const COL = { bg:"#10101c", frame:"#2a2a3d", grid:"#39ff88", X:"#ff5d5d", O:"#57c7ff", win:"#ffe066" };
const SPR = {
  X:["X.....X",".X...X.","..X.X..","...X...","..X.X..",".X...X.","X.....X"],
  O:["..XXX..",".X...X.",".X...X.",".X...X.",".X...X.",".X...X.","..XXX.."]
};
const REACTIONS = ["👍", "😂", "😮", "😢", "😡", "👏", "🤔", "😤"];

let myMark = null, S = null, hoverCell = -1, votedRematch = false , incomingOffer = false;
let lastReactionSent = 0;
const moveTimes = {};

/* ---------- audio ---------- */
let audioOn = true, actx = null;
function beep(freq, dur, delay) {
  if (!audioOn) return;
  try {
    actx = actx || new (window.AudioContext || window.webkitAudioContext)();
    const t = actx.currentTime + (delay || 0);
    const o = actx.createOscillator(), g = actx.createGain();
    o.type = "square"; o.frequency.value = freq;
    g.gain.setValueAtTime(0.06, t);
    g.gain.exponentialRampToValueAtTime(0.001, t + dur);
    o.connect(g).connect(actx.destination);
    o.start(t); o.stop(t + dur);
  } catch (e) {}
}
const music = new Audio("laidback.ogg");
music.loop = true;        // repite infinitamente
music.volume = 0.25;      // volumen de fondo (0.0 a 1.0)

let musicStarted = false;
document.addEventListener("click", () => {
  if (!musicStarted) { musicStarted = true; music.play().catch(() => {}); }
}, { once: true });

/* ---------- reacciones ---------- */
const reactPanel = $("reactPanel"), fx = $("fx");
REACTIONS.forEach(e => {
  const b = document.createElement("button");
  b.textContent = e;
  b.onclick = () => { sendReaction(e); };
  reactPanel.appendChild(b);
});
$("btnReact").onclick = (ev) => {
  ev.stopPropagation();
  reactPanel.classList.toggle("hidden");
};
document.addEventListener("click", (ev) => {
  if (!reactPanel.classList.contains("hidden") && !reactPanel.contains(ev.target) && ev.target !== $("btnReact"))
    reactPanel.classList.add("hidden");
});

function sendReaction(emoji) {
  const now = Date.now();
  if (now - lastReactionSent < 1200) return;   // anti-spam
  lastReactionSent = now;
  socket.emit("reaction", emoji);
  reactPanel.classList.add("hidden");
}

function spawnReaction(emoji, mine) {
  const el = document.createElement("div");
  el.className = "float-emoji" + (mine ? " mine" : "");
  el.textContent = emoji;
  el.style.setProperty("--dx", (Math.random() * 120 - 60) + "px");
  fx.appendChild(el);
  setTimeout(() => el.remove(), 1700);
}

/* ---------- socket ---------- */
const socket = io();

socket.on("connect", () => {
  const params = new URLSearchParams(location.search);
  const room = params.get("room") || localStorage.getItem("ttt_room");
  if (room) socket.emit("joinRoom", room);
});

socket.on("joined", ({ code, mark }) => {
  myMark = mark;
  localStorage.setItem("ttt_room", code);
  history.replaceState(null, "", "?room=" + code);
  $("menu").classList.add("hidden");
  $("game").classList.remove("hidden");
  $("roomLabel").textContent = "SALA " + code + " · TU ERES " + mark;
});

socket.on("errorMsg", (m) => {
  $("menuMsg").textContent = m;
  $("game").classList.add("hidden");
  $("menu").classList.remove("hidden");
  localStorage.removeItem("ttt_room");
});

socket.on("reaction", ({ emoji, from }) => {
  const mine = from === myMark;
  spawnReaction(emoji, mine);
  if (!mine) { beep(880, .08); beep(1175, .1, .09); }
});

socket.on("rematchOffer", ({ from }) => {
  if (from === myMark) return;                    
  incomingOffer = true;
  $("rematchText").textContent = "EL JUGADOR " + from + " PIDE REVANCHA";
  $("rematchPanel").classList.remove("hidden");
  beep(880, .08); beep(1175, .1, .09);
});

socket.on("rematchDeclined", () => {
  $("rematchPanel").classList.add("hidden");
  incomingOffer = false;
  if (votedRematch) {                             
    votedRematch = false;
    $("status").innerHTML = '<span style="color:#ff5d5d">REVANCHA RECHAZADA</span>';
    beep(160, .35);
    setTimeout(() => { if (S && S.over) updateStatus(); }, 2000);
  }
});

socket.on("state", (st) => {
  const prevBoard = S ? S.board : null;
  const prevOver = S ? S.over : null;

  if (prevBoard) {
    st.board.forEach((v, i) => {
      if (v && !prevBoard[i]) moveTimes[i] = performance.now();
      if (!v && prevBoard[i]) delete moveTimes[i];
    });
    if (st.board.every(v => !v)) Object.keys(moveTimes).forEach(k => delete moveTimes[k]);
  }

  S = st;
  if (!st.over && st.board.every(v => !v)) {
  // tablero reiniciado: limpiar todo lo de la revancha
  votedRematch = false;
  incomingOffer = false;
  $("rematchPanel").classList.add("hidden");
  }
  // si recargué la página y había una oferta pendiente, mostrarla
  if (st.rematchFrom && st.rematchFrom !== myMark) {
  incomingOffer = true;
  $("rematchText").textContent = "EL JUGADOR " + st.rematchFrom + " PIDE REVANCHA";
  $("rematchPanel").classList.remove("hidden");
  }
  updateStatus();
  updateScores();

  const newMove = st.board.some((v, i) => v && (!prevBoard || !prevBoard[i]));
  if (st.over && st.over !== prevOver) {
    if (st.over === myMark) [523,659,784,1047].forEach((f,i)=>beep(f,.12,i*.1));
    else if (st.over === "D") { beep(330,.15); beep(330,.15,.25); }
    else beep(160,.45);
  } else if (newMove && !st.over) {
    beep(st.turn === myMark ? 660 : 440, .08);
  }
});

/* ---------- UI ---------- */
$("btnCreate").onclick = () => { $("menuMsg").textContent=""; socket.emit("createRoom"); };
$("btnJoin").onclick = () => {
  const c = $("codeInput").value.trim().toUpperCase();
  if (c.length !== 4) { $("menuMsg").textContent = "El codigo tiene 4 letras"; return; }
  $("menuMsg").textContent = "";
  socket.emit("joinRoom", c);
};
$("codeInput").addEventListener("keydown", e => { if (e.key === "Enter") $("btnJoin").click(); });
$("btnLeave").onclick = () => {
  socket.emit("leave");
  $("rematchPanel").classList.add("hidden");
  localStorage.removeItem("ttt_room");
  history.replaceState(null, "", location.pathname);
  myMark = null; S = null;
  reactPanel.classList.add("hidden");
  $("game").classList.add("hidden");
  $("menu").classList.remove("hidden");
};
$("btnAccept").onclick = () => {
  socket.emit("rematch");                          
  $("rematchPanel").classList.add("hidden");
  incomingOffer = false;
};
$("btnDecline").onclick = () => {
  socket.emit("declineRematch");
  $("rematchPanel").classList.add("hidden");
  incomingOffer = false;
};
$("btnCopy").onclick = async () => {
  const link = location.origin + "/?room=" + (S ? S.code : "");
  try { await navigator.clipboard.writeText(link); $("btnCopy").textContent = "COPIADO!"; }
  catch(e) { $("btnCopy").textContent = link; }
  setTimeout(()=> $("btnCopy").textContent = "COPIAR INVITACION", 1600);
};
$("btnSound").onclick = () => {
  audioOn = !audioOn;
  $("btnSound").textContent = "MUSIQUITA: " + (audioOn ? "ON" : "OFF");
};
$("btnRematch").onclick = () => { votedRematch = true; socket.emit("rematch"); updateStatus(); };

function markSpan(m) { return '<span class="' + (m === "X" ? "cX" : "cO") + '">(' + m + ")</span>"; }

function updateStatus() {
  if (!S || !myMark) return;
  const el = $("status");
  let html = "";
  if (!S.started && !S.everStarted)
    html = 'ESPERANDO AL VAGAL...<br>COMPARTE EL CODIGO <span style="color:#ffe066">' + S.code + "</span>";
  else if (!S.started)
    html = '<span style="color:#ff5d5d">OPONENTE DESCONECTADO</span><br>ESPERANDO QUE VUELVA...';
  else if (S.over === "D")
    html = '<span style="color:#ffd166">EMPATE!</span>';
  else if (S.over)
    html = S.over === myMark ? '<span style="color:#39ff88">GANASTE!</span>' : '<span style="color:#ff5d5d">PERDISTE :(</span>';
  else
    html = S.turn === myMark ? "TU TURNO " + markSpan(myMark) : "TURNO DE " + markSpan(S.turn);

  if (S.over && S.started) {
  $("btnRematch").classList.remove("hidden");
  $("btnRematch").disabled = votedRematch;
  $("btnRematch").textContent = votedRematch ? "ESPERANDO AL VAGAL..." : "REVANCHA";
  if (votedRematch) html += '<br><span style="color:#8b8ba3;font-size:8px">ESPERANDO RESPUESTA...</span>';
  } else {
  $("btnRematch").classList.add("hidden");
}
  el.innerHTML = html;
}

function updateScores() {
  if (!S) return;
  $("scores").innerHTML =
    '<span class="sX">X: <b>' + S.scores.X + '</b></span>' +
    '<span class="sD">EMPATES: <b>' + S.scores.D + '</b></span>' +
    '<span class="sO">O: <b>' + S.scores.O + "</b></span>";
}

/* ---------- canvas ---------- */
const OFF = 40, CELL = 140, SPR_N = 7;
const SPRITE_SCALE = 0.8;   // 1.0 = ocupa toda la celda, prueba 0.7 ~ 0.9

function drawSprite(map, x, y, size, color, scale) {
  const px = (size / SPR_N) * scale;
  const total = px * SPR_N;
  const ox = x + (size - total) / 2, oy = y + (size - total) / 2;
  ctx.fillStyle = color;
  for (let r = 0; r < SPR_N; r++)
    for (let c = 0; c < SPR_N; c++)
      if (map[r][c] === "X") ctx.fillRect(ox + c * px, oy + r * px, px, px);
}

function easeOutBack(t) { const c = 1.70158; return 1 + (c + 1) * Math.pow(t - 1, 3) + c * Math.pow(t - 1, 2); }

function render(now) {
  ctx.fillStyle = COL.bg;
  ctx.fillRect(0, 0, 500, 500);

  ctx.strokeStyle = COL.frame; ctx.lineWidth = 8;
  ctx.strokeRect(14, 14, 472, 472);

  ctx.fillStyle = COL.grid;
  ctx.globalAlpha = 0.85;
  ctx.fillRect(OFF + CELL - 5, OFF, 10, CELL * 3);
  ctx.fillRect(OFF + CELL * 2 - 5, OFF, 10, CELL * 3);
  ctx.fillRect(OFF, OFF + CELL - 5, CELL * 3, 10);
  ctx.fillRect(OFF, OFF + CELL * 2 - 5, CELL * 3, 10);
  ctx.globalAlpha = 1;

  if (S) {
    if (S.combo) {
      ctx.fillStyle = COL.win; ctx.globalAlpha = 0.14;
      S.combo.forEach(i => {
        ctx.fillRect(OFF + (i % 3) * CELL + 8, OFF + Math.floor(i / 3) * CELL + 8, CELL - 16, CELL - 16);
      });
      ctx.globalAlpha = 1;
      ctx.strokeStyle = COL.win; ctx.lineWidth = 10; ctx.lineCap = "square";
      const c1 = S.combo[0], c2 = S.combo[2];
      ctx.beginPath();
      ctx.moveTo(OFF + (c1 % 3) * CELL + CELL / 2, OFF + Math.floor(c1 / 3) * CELL + CELL / 2);
      ctx.lineTo(OFF + (c2 % 3) * CELL + CELL / 2, OFF + Math.floor(c2 / 3) * CELL + CELL / 2);
      ctx.stroke();
    }

    S.board.forEach((v, i) => {
      if (!v) return;
      const x = OFF + (i % 3) * CELL, y = OFF + Math.floor(i / 3) * CELL;
      const t = Math.min(1, (now - (moveTimes[i] || now)) / 200);
      ctx.globalAlpha = t < 1 ? Math.max(0.2, t) : 1;
      drawSprite(SPR[v], x, y, CELL * SPRITE_SCALE, COL[v], t < 1 ? easeOutBack(t) : 1);
      ctx.globalAlpha = 1;
    });

    const canPlay = S.started && !S.over && S.turn === myMark;
    if (canPlay && hoverCell >= 0 && !S.board[hoverCell]) {
      ctx.globalAlpha = 0.22;
      drawSprite(SPR[myMark], OFF + (hoverCell % 3) * CELL * SPRITE_SCALE, OFF + Math.floor(hoverCell / 3) * CELL * SPRITE_SCALE, CELL * SPRITE_SCALE, COL[myMark], 1);
      ctx.globalAlpha = 1;
    }
  }

  requestAnimationFrame(render);
}
requestAnimationFrame(render);

function cellFromEvent(e) {
  const r = cv.getBoundingClientRect();
  const cx = (e.clientX - r.left) * (500 / r.width);
  const cy = (e.clientY - r.top) * (500 / r.height);
  if (cx < OFF || cy < OFF || cx >= OFF + CELL * 3 || cy >= OFF + CELL * 3) return -1;
  return Math.floor((cy - OFF) / CELL) * 3 + Math.floor((cx - OFF) / CELL);
}

cv.addEventListener("mousemove", e => { hoverCell = cellFromEvent(e); });
cv.addEventListener("mouseleave", () => { hoverCell = -1; });
cv.addEventListener("click", e => {
  const i = cellFromEvent(e);
  if (i < 0 || !S) return;
  if (S.started && !S.over && S.turn === myMark && !S.board[i]) socket.emit("move", i);
});
</script>
</body>
</html>
